# Experimental replacement for adapter_config/pascal.yaml; see README.md.
mode: 'sqadapter'
postnorm: true
adapter_num: 1
adapter_rate: 0.25
adapter_dropout: 0.6
finetune_epochs: 3
adapter_lr: 0.001

# Fixed outer weights, also used in the transport subproblem.
EMD_weight: 1.0
proto_weight: 4.0
s2q2s_prior_map_weight: 1.0
prior_distill_weight: 0.5
prior_distill_bg_weight: 0.5

# Numerical solver budgets / feasibility tolerance.
ot_inner_steps: 3
ot_max_iter: 50
ot_marginal_tol: 0.001
ot_backtracking_steps: 4
